<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="620" viewBox="0 0 1900 620">
<defs>
 <style>
 .h{font:700 25px Arial,sans-serif;fill:#26343e}.t{font:600 18px Arial,sans-serif;fill:#26343e}.s{font:15px Arial,sans-serif;fill:#596772}.x{font:13px Arial,sans-serif;fill:#73808a}
 .b{fill:#eaf3fa;stroke:#789bb1;stroke-width:2}.b2{fill:#d8e9f5;stroke:#789bb1;stroke-width:2}.a{fill:#fff3dd;stroke:#d6a153;stroke-width:2}.g{fill:#e4f4ec;stroke:#68a98c;stroke-width:2}.g2{fill:#cce9db;stroke:#68a98c;stroke-width:2}.n{fill:#f8fafb;stroke:#81919b;stroke-width:2}
 .ar{fill:none;stroke:#64747e;stroke-width:2.2;marker-end:url(#m)}.th{fill:none;stroke:#91a0a9;stroke-width:1.6;marker-end:url(#mt)}
 </style>
 <marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64747e"/></marker>
 <marker id="mt" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#91a0a9"/></marker>
</defs>
<rect x="18" y="18" width="1864" height="584" fill="white" stroke="#577080" stroke-width="2"/>
<text x="45" y="62" class="h">(a)</text>

<!-- input map -->
<g transform="translate(65 165)">
 <rect width="135" height="135" rx="4" class="n"/>
 <g><rect x="14" y="14" width="27" height="27" fill="#8fc1df"/><rect x="41" y="14" width="27" height="27" fill="#5d9dca"/><rect x="68" y="14" width="27" height="27" fill="#b7d7e9"/><rect x="95" y="14" width="27" height="27" fill="#72add2"/><rect x="14" y="41" width="27" height="27" fill="#669fca"/><rect x="41" y="41" width="27" height="27" fill="#a9cfe5"/><rect x="68" y="41" width="27" height="27" fill="#4c8fc0"/><rect x="95" y="41" width="27" height="27" fill="#95c2dc"/><rect x="14" y="68" width="27" height="27" fill="#b8d8e9"/><rect x="41" y="68" width="27" height="27" fill="#73add2"/><rect x="68" y="68" width="27" height="27" fill="#9cc6de"/><rect x="95" y="68" width="27" height="27" fill="#5d9dca"/><rect x="14" y="95" width="27" height="27" fill="#74aed3"/><rect x="41" y="95" width="27" height="27" fill="#5998c5"/><rect x="68" y="95" width="27" height="27" fill="#c1ddeb"/><rect x="95" y="95" width="27" height="27" fill="#82b6d7"/></g>
 <rect x="71" y="45" width="27" height="27" fill="none" stroke="#405f72" stroke-width="3"/>
 <text x="68" y="169" text-anchor="middle" class="t">Raman maps</text><text x="68" y="193" text-anchor="middle" class="s">pixel spectra</text>
</g>
<path class="ar" d="M210 232H252"/>

<!-- spectrum -->
<g transform="translate(265 165)">
 <rect width="205" height="135" rx="4" class="n"/>
 <path d="M12 110L26 105L36 108L47 68L57 108L70 103L82 106L92 30L103 108L116 100L128 105L139 57L151 107L166 101L178 84L190 106" fill="none" stroke="#73a9cb" stroke-width="4"/>
 <text x="102" y="169" text-anchor="middle" class="t">Full spectrum</text><text x="102" y="193" text-anchor="middle" class="s">log(1+x) · 1,290 channels</text><text x="102" y="217" text-anchor="middle" class="x">NNLS hit-pixel gate</text>
</g>
<path class="ar" d="M480 232H518"/>

<!-- composition MLP -->
<g transform="translate(530 115)">
 <text x="195" y="0" text-anchor="middle" class="h">Composition MLP</text>
 <rect x="0" y="57" width="70" height="214" rx="6" class="b"/><rect x="96" y="83" width="66" height="162" rx="6" class="b2"/><rect x="190" y="108" width="60" height="112" rx="6" class="b2"/><rect x="280" y="130" width="45" height="68" rx="5" class="n"/>
 <path class="th" d="M70 164H96"/><path class="th" d="M162 164H190"/><path class="th" d="M250 164H280"/>
 <text x="35" y="298" text-anchor="middle" class="t">1,290</text><text x="129" y="298" text-anchor="middle" class="t">256</text><text x="220" y="298" text-anchor="middle" class="t">64</text><text x="302" y="298" text-anchor="middle" class="t">3</text>
 <text x="142" y="326" text-anchor="middle" class="s">BN · ReLU · dropout 0.15</text><text x="302" y="326" text-anchor="middle" class="s">softmax</text>
 <rect x="355" y="111" width="42" height="42" fill="#2f82d0"/><rect x="355" y="153" width="42" height="42" fill="#38a77b"/><rect x="355" y="195" width="42" height="42" fill="#e84f79"/><text x="408" y="137" class="x">DQ</text><text x="408" y="179" class="x">TBZ</text><text x="408" y="221" class="x">THI</text><text x="376" y="265" text-anchor="middle" class="s">per-pixel maps</text>
</g>

<!-- map composition output -->
<path class="th" d="M950 315C975 336 972 407 1000 407"/>
<g transform="translate(995 368)"><rect width="170" height="78" rx="6" class="b"/><text x="85" y="31" text-anchor="middle" class="t">Mean pooling</text><text x="85" y="57" text-anchor="middle" class="s">map composition (%)</text></g>

<!-- calibration pathway -->
<path class="ar" d="M960 232H996"/>
<g transform="translate(1008 118)">
 <text x="278" y="0" text-anchor="middle" class="h">Calibration-guided initialization</text>
 <rect x="0" y="55" width="174" height="112" rx="6" class="a"/><text x="87" y="91" text-anchor="middle" class="t">Component-wise</text><text x="87" y="118" text-anchor="middle" class="t">signal separation</text><text x="87" y="146" text-anchor="middle" class="x">DQ · TBZ · THI</text>
 <path class="th" d="M174 111H205"/>
 <rect x="210" y="55" width="190" height="112" rx="6" class="a"/><text x="305" y="89" text-anchor="middle" class="t">Single-component</text><text x="305" y="116" text-anchor="middle" class="t">calibration inversion</text><text x="305" y="145" text-anchor="middle" class="x">linear range: 1–100 μM</text>
 <path class="th" d="M400 111H430"/>
 <rect x="435" y="55" width="120" height="112" rx="6" class="a"/><text x="495" y="98" text-anchor="middle" class="t">Ccal</text><text x="495" y="126" text-anchor="middle" class="s">initial μM × 3</text>
</g>

<!-- residual head -->
<path class="ar" d="M1503 286C1503 340 1455 346 1455 381"/>
<path class="th" d="M1165 407H1400"/>
<g transform="translate(1400 350)">
 <text x="188" y="0" text-anchor="middle" class="h">Residual concentration MLP</text>
 <rect x="0" y="38" width="116" height="132" rx="6" class="g"/><text x="58" y="75" text-anchor="middle" class="t">Ccal</text><text x="58" y="102" text-anchor="middle" class="s">composition</text><text x="58" y="128" text-anchor="middle" class="s">intensity context</text>
 <path class="th" d="M116 104H143"/><rect x="148" y="51" width="57" height="106" rx="6" class="g2"/><rect x="235" y="69" width="52" height="70" rx="6" class="g2"/><rect x="317" y="80" width="47" height="48" rx="5" class="g"/><path class="th" d="M205 104H235"/><path class="th" d="M287 104H317"/>
 <text x="176" y="192" text-anchor="middle" class="t">128</text><text x="261" y="192" text-anchor="middle" class="t">32</text><text x="340" y="192" text-anchor="middle" class="t">3</text><text x="228" y="220" text-anchor="middle" class="s">BN · ReLU · dropout 0.25</text><text x="340" y="220" text-anchor="middle" class="x">Δlog C</text>
</g>

<!-- final -->
<path class="ar" d="M1765 454C1825 454 1830 303 1780 303"/>
<g transform="translate(1640 180)"><rect width="205" height="123" rx="7" class="g"/><text x="102" y="38" text-anchor="middle" class="t">Final concentration</text><text x="102" y="72" text-anchor="middle" class="t">Cfinal = Ccal × 10<tspan baseline-shift="super" font-size="12">Δlog C</tspan></text><text x="102" y="102" text-anchor="middle" class="s">DQ · TBZ · THI (μM)</text></g>

<!-- training note -->
<path d="M520 563H1845" fill="none" stroke="#a6b0b7" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="535" y="590" class="s">Staged training: train composition MLP → freeze composition backbone → train residual concentration head using mixture concentration labels · condition-grouped held-out validation</text>
</svg>
