<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .panel { font-size: 28px; font-weight: 700; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 21px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; fill: #53606c; }
      .muted { fill: #6b7680; }
      .box { fill: #ffffff; stroke: #cbd3da; stroke-width: 1.6; }
      .soft { fill: #f5f7f8; stroke: #d8dee3; stroke-width: 1.3; }
      .arrow { stroke: #35414c; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #aab4bd; stroke-width: 1.15; fill: none; }
      .dash { stroke: #8b959d; stroke-width: 1.7; stroke-dasharray: 7 6; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35414c"/>
    </marker>
    <clipPath id="mapClip"><rect x="86" y="217" width="205" height="205" rx="8"/></clipPath>
  </defs>

  <rect width="1800" height="1000" fill="#ffffff"/>
  <text x="56" y="61" class="title">NNLS-gated dual-head network for quantitative SERS mixture analysis</text>
  <text x="56" y="91" class="small muted">Map-resolved learning links spectral composition to absolute concentration without pixel-level data leakage</text>
  <line x1="56" y1="112" x2="1744" y2="112" stroke="#27323c" stroke-width="2"/>

  <!-- Panel a -->
  <text x="56" y="158" class="panel">a</text>
  <text x="95" y="158" class="section">SERS map and informative-pixel selection</text>

  <rect x="67" y="185" width="618" height="592" rx="14" class="box"/>

  <!-- Synthetic map -->
  <rect x="86" y="217" width="205" height="205" rx="8" fill="#eef1f3" stroke="#b8c1c9" stroke-width="1.5"/>
  <g clip-path="url(#mapClip)">
    <rect x="86" y="217" width="205" height="205" fill="#1d2730"/>
    <g opacity="0.94">
      <circle cx="108" cy="239" r="15" fill="#0067b1"/><circle cx="139" cy="240" r="15" fill="#009e73"/><circle cx="170" cy="240" r="15" fill="#d55e00"/><circle cx="201" cy="240" r="15" fill="#687580"/><circle cx="232" cy="240" r="15" fill="#009e73"/><circle cx="263" cy="240" r="15" fill="#0067b1"/>
