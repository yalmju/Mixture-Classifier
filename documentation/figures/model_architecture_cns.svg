  <text x="782" y="474" text-anchor="middle" class="label">1,290</text><text x="782" y="495" text-anchor="middle" class="tiny">input</text>
  <text x="910" y="474" text-anchor="middle" class="label">256</text><text x="910" y="495" text-anchor="middle" class="tiny">BN · ReLU</text><text x="910" y="514" text-anchor="middle" class="tiny">dropout 0.15</text>
  <text x="1032" y="474" text-anchor="middle" class="label">64</text><text x="1032" y="495" text-anchor="middle" class="tiny">ReLU</text>
  <text x="1146" y="474" text-anchor="middle" class="label">4</text><text x="1146" y="495" text-anchor="middle" class="tiny">Softmax</text>

  <!-- composition output -->
  <rect x="758" y="559" width="417" height="168" rx="10" class="soft"/>
  <text x="779" y="591" class="label">Map-level composition</text>
  <text x="1152" y="591" text-anchor="end" class="tiny">mean pooling over pixels</text>
  <rect x="780" y="622" width="126" height="36" rx="3" fill="#0067b1"/><rect x="906" y="622" width="90" height="36" fill="#009e73"/><rect x="996" y="622" width="70" height="36" fill="#d94b63"/><rect x="1066" y="622" width="82" height="36" rx="3" fill="#687580"/>
  <text x="843" y="646" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">DQ</text>
