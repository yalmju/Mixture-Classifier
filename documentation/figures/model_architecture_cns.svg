  <g stroke="#c5cdd3" stroke-width="0.9" opacity="0.8">
    <line x1="782" y1="327" x2="902" y2="294"/><line x1="782" y1="327" x2="902" y2="322"/><line x1="782" y1="327" x2="902" y2="350"/><line x1="782" y1="327" x2="902" y2="378"/>
