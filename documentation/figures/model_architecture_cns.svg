  <g fill="#8064a2"><circle cx="1593" cy="338" r="8"/><circle cx="1593" cy="376" r="8"/></g>
  <g><circle cx="1672" cy="319" r="11" fill="#0067b1"/><circle cx="1672" cy="361" r="11" fill="#009e73"/><circle cx="1672" cy="403" r="11" fill="#d94b63"/></g>
  <text x="1513" y="455" text-anchor="middle" class="label">128</text><text x="1513" y="476" text-anchor="middle" class="tiny">BN · ReLU</text><text x="1513" y="495" text-anchor="middle" class="tiny">dropout 0.25</text>
  <text x="1593" y="455" text-anchor="middle" class="label">32</text><text x="1593" y="476" text-anchor="middle" class="tiny">ReLU</text>
  <text x="1672" y="455" text-anchor="middle" class="label">3</text><text x="1672" y="476" text-anchor="middle" class="tiny">log₁₀(µM)</text>

