  <text x="1299" y="158" class="section">Concentration head</text>
  <rect x="1249" y="185" width="495" height="592" rx="14" class="box"/>

  <text x="1288" y="230" class="label">Context-aware concentration MLP</text>
  <text x="1288" y="256" class="tiny">Trainable parameters: 6,659</text>

