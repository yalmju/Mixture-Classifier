  <path d="M685 482 L713 482" class="arrow"/>
  <path d="M1219 626 L1248 626" class="arrow"/>

  <!-- Bottom validation strip -->
  <rect x="67" y="816" width="1677" height="126" rx="12" fill="#f5f7f8" stroke="#d4dbe0" stroke-width="1.4"/>
