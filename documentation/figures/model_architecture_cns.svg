  <text x="346" y="316" text-anchor="middle" class="tiny" transform="rotate(-90 346 316)">Intensity</text>
  <text x="489" y="450" text-anchor="middle" class="label">Pixel spectrum</text>
  <text x="489" y="474" text-anchor="middle" class="small muted">1,290 spectral channels</text>

  <path d="M292 319 L330 319" class="arrow"/>

  <!-- Preprocess + gate -->
  <rect x="111" y="529" width="222" height="92" rx="10" class="soft"/>
  <text x="222" y="562" text-anchor="middle" class="label">Preprocessing</text>
  <text x="222" y="590" text-anchor="middle" class="small">log(1 + intensity)</text>
  <path d="M291 494 L291 515 L222 515 L222 528" class="arrow"/>

  <rect x="381" y="514" width="239" height="122" rx="10" fill="#eff8f4" stroke="#5aa786" stroke-width="1.8"/>
  <text x="500" y="548" text-anchor="middle" class="label">NNLS screening gate</text>
  <text x="500" y="577" text-anchor="middle" class="small">component fraction ≥ 0.15</text>
  <line x1="411" y1="596" x2="590" y2="596" stroke="#9bbcac" stroke-width="1"/>
  <text x="500" y="619" text-anchor="middle" class="tiny">selection only — not the final ratio</text>
  <path d="M333 575 L380 575" class="arrow"/>

  <rect x="181" y="685" width="390" height="55" rx="27" fill="#17212b"/>
  <text x="376" y="719" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#ffffff">Selected spectra retained with map identity</text>
  <path d="M500 636 L500 660 L376 660 L376 684" class="arrow"/>

  <!-- Panel b -->
  <text x="725" y="158" class="panel">b</text>
  <text x="764" y="158" class="section">Composition head</text>
  <rect x="714" y="185" width="505" height="592" rx="14" class="box"/>

  <text x="757" y="230" class="label">Pixel-wise composition MLP</text>
  <text x="757" y="256" class="tiny">Trainable parameters: 347,716</text>

