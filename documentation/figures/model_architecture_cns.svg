      <circle cx="108" cy="303" r="15" fill="#d55e00"/><circle cx="139" cy="303" r="15" fill="#0067b1"/><circle cx="170" cy="303" r="15" fill="#009e73"/><circle cx="201" cy="303" r="15" fill="#687580"/><circle cx="232" cy="303" r="15" fill="#0067b1"/><circle cx="263" cy="303" r="15" fill="#009e73"/>
      <circle cx="108" cy="335" r="15" fill="#687580"/><circle cx="139" cy="335" r="15" fill="#009e73"/><circle cx="170" cy="335" r="15" fill="#d55e00"/><circle cx="201" cy="335" r="15" fill="#009e73"/><circle cx="232" cy="335" r="15" fill="#687580"/><circle cx="263" cy="335" r="15" fill="#0067b1"/>
      <circle cx="108" cy="367" r="15" fill="#0067b1"/><circle cx="139" cy="367" r="15" fill="#d55e00"/><circle cx="170" cy="367" r="15" fill="#687580"/><circle cx="201" cy="367" r="15" fill="#0067b1"/><circle cx="232" cy="367" r="15" fill="#009e73"/><circle cx="263" cy="367" r="15" fill="#d55e00"/>
